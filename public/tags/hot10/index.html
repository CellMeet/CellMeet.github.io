<script>
  (function () {
    var root = document.documentElement;
    var tray = document.querySelector(".side-tools");
    var gear = document.getElementById("side-settings");
    if (gear && tray) {
      gear.addEventListener("click", function (e) {
        e.stopPropagation();
        var open = tray.classList.toggle("open");
        gear.setAttribute("aria-expanded", open ? "true" : "false");
      });
      document.addEventListener("click", function (e) {
        if (!tray.contains(e.target)) {
          tray.classList.remove("open");
          gear.setAttribute("aria-expanded", "false");
        }
      });
    }
    var themeBtn = document.getElementById("side-theme");
    if (themeBtn) {
      themeBtn.addEventListener("click", function () {
        var next = root.dataset.theme === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        localStorage.setItem("pref-theme", next);
      });
    }
    var layoutBtn = document.getElementById("side-layout");
    if (localStorage.getItem("home-layout") === "two") {
      document.body.classList.add("two-col");
    }
    if (layoutBtn) {
      layoutBtn.addEventListener("click", function () {
        var isTwo = document.body.classList.toggle("two-col");
        localStorage.setItem("home-layout", isTwo ? "two" : "one");
      });
    }
    if (tray) {
      var ticking = false;
      function updateTools() {
        var show = window.scrollY > 220;
        tray.classList.toggle("visible", show);
        if (!show) {
          tray.classList.remove("open");
          if (gear) gear.setAttribute("aria-expanded", "false");
        }
        ticking = false;
      }
      window.addEventListener("scroll", function () {
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(updateTools);
        }
      }, { passive: true });
      updateTools();
    }
  })();
</script>

<script>
  (function () {
    var langMap = {
      cpp: "C++", c: "C", cs: "C#", go: "Go", golang: "Go",
      js: "JavaScript", javascript: "JavaScript", ts: "TypeScript", typescript: "TypeScript",
      py: "Python", python: "Python", java: "Java", kt: "Kotlin", kotlin: "Kotlin",
      rs: "Rust", rust: "Rust", sh: "Shell", bash: "Bash", zsh: "Zsh",
      powershell: "PowerShell", html: "HTML", xml: "XML", css: "CSS", scss: "SCSS",
      json: "JSON", yaml: "YAML", yml: "YAML", md: "Markdown", markdown: "Markdown",
      sql: "SQL", php: "PHP", rb: "Ruby", ruby: "Ruby", swift: "Swift"
    };

    function prettyLang(lang) {
      var key = (lang || "").toLowerCase();
      return langMap[key] || (lang ? lang.toUpperCase() : "Code");
    }

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise(function (resolve, reject) {
        try {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
          resolve();
        } catch (e) {
          reject(e);
        }
      });
    }

    function initCodeWindows() {
      document.querySelectorAll(".post-content .highlight").forEach(function (block) {
        if (block.querySelector(".code-window-bar")) return;

        var code = block.querySelector(".lntd:last-child code") ||
                   block.querySelector("code[data-lang]") ||
                   block.querySelector("code");
        var lang = code ? (code.getAttribute("data-lang") || "") : "";

        var bar = document.createElement("div");
        bar.className = "code-window-bar";
        bar.innerHTML =
          '<span class="code-dots"><i></i><i></i><i></i></span>' +
          '<span class="code-lang">' + prettyLang(lang) + '</span>' +
          '<button type="button" class="code-copy" aria-label="复制代码">' +
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>' +
          '</button>' +
          '<span class="code-chevron" aria-hidden="true">' +
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>' +
          '</span>';

        block.insertBefore(bar, block.firstChild);

        var btn = bar.querySelector(".code-copy");
        btn.addEventListener("click", function () {
          copyText(code ? code.innerText : block.innerText).then(function () {
            btn.classList.add("copied");
            setTimeout(function () { btn.classList.remove("copied"); }, 1500);
          }).catch(function () {});
        });
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initCodeWindows);
    } else {
      initCodeWindows();
    }
    window.addEventListener("load", initCodeWindows);
  })();
</script>

                target.scrollIntoView();
            }
            
            
            if (target.tabIndex < 0 && !target.hasAttribute("tabindex")) {
                target.setAttribute("tabindex", "-1");
            }
            target.focus({ preventScroll: true });
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>
    var toplink = document.getElementById("top-link");
    var scrollTicking = false;
    
    window.addEventListener("scroll", function () {
        if (scrollTicking) {
            return;
        }
        scrollTicking = true;
        requestAnimationFrame(function () {
            const scrollThreshold = window.innerHeight;
            const shown = document.body.scrollTop > scrollThreshold || document.documentElement.scrollTop > scrollThreshold;
            toplink.classList.toggle("hidden", !shown);
            scrollTicking = false;
        });
    }, { passive: true });

</script>
<script>
    document.getElementById("theme-toggle").addEventListener("click", () => {
        const html = document.querySelector("html");
        if (html.dataset.theme === "dark") {
            html.dataset.theme = 'light';
            localStorage.setItem("pref-theme", 'light');
        } else {
            html.dataset.theme = 'dark';
            localStorage.setItem("pref-theme", 'dark');
        }
    })

</script>
