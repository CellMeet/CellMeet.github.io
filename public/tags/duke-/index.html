<script>
  (function () {
    var root = document.documentElement;
    var tray = document.querySelector(".side-tools");
    var gear = document.getElementById("side-settings");
    if (gear && tray) {
      gear.addEventListener("click", function (e) {
        e.stopPropagation();
        var open = tray.classList.toggle("open");
        gear.setAttribute("aria-expanded", open ? "true" : "false");
      });
      document.addEventListener("click", function (e) {
        if (!tray.contains(e.target)) {
          tray.classList.remove("open");
          gear.setAttribute("aria-expanded", "false");
        }
      });
    }
    var themeBtn = document.getElementById("side-theme");
    if (themeBtn) {
      themeBtn.addEventListener("click", function () {
        var next = root.dataset.theme === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        localStorage.setItem("pref-theme", next);
      });
    }
    var layoutBtn = document.getElementById("side-layout");
    if (localStorage.getItem("home-layout") === "two") {
      document.body.classList.add("two-col");
    }
    if (layoutBtn) {
      layoutBtn.addEventListener("click", function () {
        var isTwo = document.body.classList.toggle("two-col");
        localStorage.setItem("home-layout", isTwo ? "two" : "one");
      });
    }
    if (tray) {
      var ticking = false;
      function updateTools() {
        var show = window.scrollY > 220;
        tray.classList.toggle("visible", show);
        if (!show) {
          tray.classList.remove("open");
          if (gear) gear.setAttribute("aria-expanded", "false");
        }
        ticking = false;
      }
      window.addEventListener("scroll", function () {
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(updateTools);
        }
      }, { passive: true });
      updateTools();
    }
  })();
</script>

    }
    function start() {
      if (typeof Typed !== "function") {
        el.textContent = text;
        return;
      }
      new Typed("#home-subtitle", {
        strings: [text],
        startDelay: 500,
        typeSpeed: 160,
        backSpeed: 100,
        backDelay: 2400,
        loop: true
      });
    }
    if (typeof Typed === "function") {
      start();
      return;
    }
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/typed.js@3.0.0/dist/typed.umd.min.js";
    s.onload = start;
    s.onerror = function () { el.textContent = text; };
    document.head.appendChild(s);
  })();
</script>

      return langMap[key] || (lang ? lang.toUpperCase() : "Code");
    }

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise(function (resolve, reject) {
        try {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
          resolve();

      });

          '</button>';

        block.insertBefore(bar, block.firstChild);

        btn.addEventListener("click", function () {

            btn.classList.add("copied");

<script>
(function () {
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function initSphere(el) {
    if (el.dataset.sphereReady === "1") return;
    var nodes = Array.prototype.slice.call(el.querySelectorAll("a"));
    if (!nodes.length) return;
    el.dataset.sphereReady = "1";

    var n = nodes.length;
    var items = nodes.map(function (a, i) {
      var y = 1 - ((i + 0.5) / n) * 2;
      var r = Math.sqrt(Math.max(0, 1 - y * y));
      var theta = i * 2.399963229728653 + 0.6;
      return { el: a, x: Math.cos(theta) * r, y: y, z: Math.sin(theta) * r };
    });

    var rotX = -0.22;
    var rotY = 0.4;
    var paused = false;
    var hovering = false;
    var dragging = false;
    var lastX = 0, lastY = 0, moved = 0;
    var lastT = performance.now();

    el.classList.add("sphere-ready");

    function size() {
      return { w: el.clientWidth || 280, h: el.clientHeight || 250 };
    }

    function render() {
      var s = size();
      var R = Math.min(s.w * 0.46, s.h * 0.55);
      var sy = Math.sin(rotY), cyy = Math.cos(rotY);
      var sx = Math.sin(rotX), cxx = Math.cos(rotX);

      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        var x1 = it.x * cyy - it.z * sy;
        var z1 = it.x * sy + it.z * cyy;
        var y1 = it.y * cxx - z1 * sx;
        var z2 = it.y * sx + z1 * cxx;
        var p = 1.9 / (2.6 - z2);
        var px = x1 * R * p;
        var py = y1 * R * p - 13;
        var scale = p * 0.78;
        it.el.style.transform = "translate(-50%, -50%) translate(" + px.toFixed(1) + "px, " + py.toFixed(1) + "px) scale(" + scale.toFixed(3) + ")";
        it.el.style.opacity = (0.32 + ((z2 + 1) / 2) * 0.68).toFixed(3);
        it.el.style.zIndex = String(Math.round((z2 + 1) * 100));
      }
    }

    function frame(t) {
      var dt = Math.min(60, t - lastT);
      lastT = t;
      if (!paused && !dragging && !reduceMotion) {
        rotY += dt * 0.00012;
      }
      render();
      requestAnimationFrame(frame);
    }

    el.addEventListener("pointerenter", function (e) {
      hovering = true;
      paused = true;
      lastX = e.clientX;
      lastY = e.clientY;
    });
    el.addEventListener("pointerleave", function () {
      hovering = false;
      paused = false;
    });

    el.addEventListener("pointerdown", function (e) {
      dragging = true;
      moved = 0;
      lastX = e.clientX;
      lastY = e.clientY;
      el.classList.add("is-dragging");
      if (el.setPointerCapture && e.pointerId != null) {
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
      }
    });

    el.addEventListener("pointermove", function (e) {
      if (!hovering && !dragging) return;
      var dx = e.clientX - lastX;
      var dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      moved += Math.abs(dx) + Math.abs(dy);
      if (e.pointerType === "mouse" || dragging) {
        rotY -= dx * 0.009;
        rotX += dy * 0.006;
      }
    });

    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      el.classList.remove("is-dragging");
      if (el.releasePointerCapture && e.pointerId != null) {
        try { el.releasePointerCapture(e.pointerId); } catch (err) {}
      }
    }
    el.addEventListener("pointerup", endDrag);
    el.addEventListener("pointercancel", endDrag);

    el.addEventListener("click", function (e) {
      if (moved > 8) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);

    el.addEventListener("wheel", function (e) {
      e.preventDefault();
      e.stopPropagation();
      rotY -= e.deltaY * 0.0022;
    }, { passive: false });

    if (window.ResizeObserver) {
      new ResizeObserver(render).observe(el);
    }

    render();
    requestAnimationFrame(frame);
  }

  function start() {
    var list = document.querySelectorAll(".tag-sphere");
    for (var i = 0; i < list.length; i++) initSphere(list[i]);
  }

  start();
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  }
  window.addEventListener("load", start);
})();
</script>

<script>
(function () {
  function updateScrollIndent(scroll) {
    var items = Array.prototype.slice.call(scroll.querySelectorAll("li"));
    if (!items.length) return;
    var box = scroll.getBoundingClientRect();
    var visible = items.filter(function (li) {
      var r = li.getBoundingClientRect();
      return r.bottom > box.top && r.top < box.bottom;
    });
    var mid = Math.min(2, visible.length - 1);
    visible.forEach(function (li, idx) {
      var d = Math.abs(idx - mid);
      var off = d >= 2 ? 18 : (d === 1 ? 6 : 0);
      var a = li.querySelector("a");
      if (a) {
        a.style.paddingLeft = off + "px";
        a.style.opacity = "1";
         
        a.style.color = d === 0 ? "var(--cat-strong)" : (d === 1 ? "var(--cat-mid)" : "var(--cat-soft)");
      }
    });
  }

  function init() {
    document.querySelectorAll(".sidebar-terms-scroll").forEach(function (scroll) {
      updateScrollIndent(scroll);
      scroll.addEventListener("scroll", function () { updateScrollIndent(scroll); }, { passive: true });
      window.addEventListener("resize", function () { updateScrollIndent(scroll); });
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>


<script>
(function () {
  function getHighlightQuery() {
    try {
      return (new URLSearchParams(window.location.search).get("highlight") || "").trim();
    } catch (e) {
      return "";
    }
  }

  function highlightNode(node, query) {
    var text = node.nodeValue;
    if (!text) return null;
    var lower = text.toLowerCase();
    var q = query.toLowerCase();
    var pos = lower.indexOf(q);
    if (pos === -1) return null;
    var frag = document.createDocumentFragment();
    var last = 0;
    while (pos !== -1) {
      if (pos > last) frag.appendChild(document.createTextNode(text.slice(last, pos)));
      var span = document.createElement("span");
      span.className = "search-hit";
      span.textContent = text.slice(pos, pos + query.length);
      frag.appendChild(span);
      last = pos + query.length;
      pos = lower.indexOf(q, last);
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    return frag;
  }

  function run() {
    var query = getHighlightQuery();
    if (!query) return;
    var root = document.querySelector(".post-content");
    if (!root) return;

    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (node) {
        if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        var p = node.parentElement;
        if (p && p.closest("script,style,noscript")) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });

    var nodes = [];
    var n;
    while ((n = walker.nextNode())) nodes.push(n);
    nodes.forEach(function (node) {
      var frag = highlightNode(node, query);
      if (frag) node.parentNode.replaceChild(frag, node);
    });

    var hit = root.querySelector(".search-hit");
    if (hit) {
      try { hit.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (e) {}
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", run);
  } else {
    run();
  }
})();
</script>

<script>
    let menu = document.getElementById('menu');
    if (menu) {
        
        const scrollPosition = localStorage.getItem("menu-scroll-position");
        if (scrollPosition) {
            menu.scrollLeft = parseInt(scrollPosition, 10);
        }
        
        
        let menuScrollTimeout;
        menu.addEventListener("scroll", function () {
            clearTimeout(menuScrollTimeout);
            menuScrollTimeout = setTimeout(function () {
                localStorage.setItem("menu-scroll-position", menu.scrollLeft);
            }, 150);
        }, { passive: true });
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            const target = document.querySelector(`[id='${decodeURIComponent(id)}']`);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                target.scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                target.scrollIntoView();
            }
            
            
            if (target.tabIndex < 0 && !target.hasAttribute("tabindex")) {
                target.setAttribute("tabindex", "-1");
            }
            target.focus({ preventScroll: true });
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>
    var toplink = document.getElementById("top-link");

    window.addEventListener("scroll", function () {
        if (scrollTicking) {
            return;
        }
        scrollTicking = true;
        requestAnimationFrame(function () {
            const scrollThreshold = window.innerHeight;
            const shown = document.body.scrollTop > scrollThreshold || document.documentElement.scrollTop > scrollThreshold;
            toplink.classList.toggle("hidden", !shown);
            scrollTicking = false;
        });
    }, { passive: true });
