baseURL: "https://atindoc.github.io/"
title: "Tian Junkai's Blog Space"
theme: ["PaperMod"]
locale: "zh-CN"
defaultContentLanguage: "zh-cn"
hasCJKLanguage: true
enableEmoji: true
enableRobotsTXT: true

# 每页文章数
pagination:
  pagerSize: 9
summaryLength: 80

taxonomies:
  category: categories
  tag: tags

# 代码高亮：使用 class 模式，才能配合自定义配色（参考 luotian 的 highlight 配置）
markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    tabWidth: 4
  tableOfContents:
    startLevel: 2
    endLevel: 4
  goldmark:
    extensions:
      typographer:
        apostrophe: "'"
        leftSingleQuote: "'"
        rightSingleQuote: "'"
        leftDoubleQuote: '"'
        rightDoubleQuote: '"'

# 首页需要 JSON 输出，供搜索页使用
outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  description: "记录音乐、书影、随笔与代码。Java · Golang · AI · Security。"
  keywords:
    - Tian Junkai
    - 博客
    - Golang
    - Java
    - 大模型
    - 深度学习
    - 网络攻防
    - 力扣
  author: "Tian Junkai"
  mainSections: ["posts"]
  # 头像：推荐把图片放到 assets/ 下再填文件名（会自动加缓存指纹）；
  # 留空则自动查找 static/avatar.jpg|png|webp|svg
  avatar: ""

  # ---------- 首页 / 侧栏（复刻 luotian 布局） ----------
  # 首页大标题下的一句话（留空则不显示，自己写好后填在这里）
  homeSubtitle: ""
  # 首页打字机效果文字（循环打字/删除）
  homeTypingText: "为 美 好 的 世 界 献 上 祝 福 ！"
  # 右侧个人介绍：留空即不显示，自己写好后填在这里
  homeBio: "努力成为马猴帝！（笑）这里会持续更新读书、观影、音乐与技术笔记，欢迎关注！"
  # 右侧公告卡片（留空则不显示）
  announcement: ""
  # 文章没有 cover 时的默认封面图（先留空；以后想统一用某张图再填，如 "/bzh.jpeg"）
  defaultCover: ""
  # 网站信息卡片里的建站时间（运行时间从此日期开始计算）
  startDate: "2026-11-20"

  # 首页分类标签的展示顺序（其余分类会自动追加）
  categoryOrder:
    - essay
    - music
    - Books
    - movie
    - deep learning
    - security
    - 力扣
    - Golang
    - Java

  # 外观
  defaultTheme: "auto"
  ShowReadingTime: true
  ShowWordCount: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: false
  ShowBreadCrumbs: true
  ShowToc: true
  TocOpen: false
  ShowShareButtons: false
  ShowAllPagesInArchive: true
  disableSpecial1stPost: true
  DateFormat: "2006-01-02"

  # 站点图标（统一使用一个 SVG，避免 404）
  assets:
    favicon: "/favicon.svg"
    favicon16x16: "/favicon.svg"
    favicon32x32: "/favicon.svg"
    apple_touch_icon: "/favicon.svg"
    safari_pinned_tab: "/favicon.svg"
    theme_color: "#fbfbfd"
    msapplication_TileColor: "#fbfbfd"

  label:
    text: "Tian Junkai"

  socialIcons:
    - name: github
      url: "https://github.com/atindoc"
    - name: rss
      url: "/index.xml"

