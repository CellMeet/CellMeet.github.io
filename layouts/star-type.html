{{- define "main" }}
<div class="star-page star-type-page">
  <header class="star-list-header">
    <h1>{{ .Title }}</h1>
    {{- with .Content }}<div class="star-list-intro">{{ . }}</div>{{ end }}
  </header>

  {{- $paginator := .Paginate .Pages }}
  {{ partial "star_timeline.html" (dict "pages" $paginator.Pages) }}
  {{ partial "home_pagination.html" $paginator }}
</div>
{{- end }}
