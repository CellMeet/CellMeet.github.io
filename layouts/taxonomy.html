{{- define "main" }}

{{- if .Title }}
<header class="page-header">
    <h1>{{ .Title }}</h1>
    {{- if .Description }}
    <div class="post-description">
        {{ .Description }}
    </div>
    {{- end }}
</header>
{{- end }}

<ul class="terms-tags">
    {{- range .Data.Terms.Alphabetical }}
    <li>
        <a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}<span class="cat-count">{{ .Count }}</span></a>
    </li>
    {{- end }}
</ul>

{{- end }}{{/* end main */ -}}
