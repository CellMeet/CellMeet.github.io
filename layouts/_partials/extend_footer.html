{{- if and (eq .Kind "page") (ne .Layout "search") (ne .Layout "archives") }}
<div id="reading-progress" aria-hidden="true"></div>
<script>
    (function () {
        var bar = document.getElementById("reading-progress");
        var article = document.querySelector(".post-content") || document.querySelector("article");
        if (!bar || !article) return;
        function update() {
            var rect = article.getBoundingClientRect();
            var total = rect.height - window.innerHeight;
            var progress = total > 0 ? Math.min(Math.max(-rect.top / total, 0), 1) : 0;
            bar.style.width = (progress * 100) + "%";
        }
        document.addEventListener("scroll", update, { passive: true });
        window.addEventListener("resize", update);
        update();
    })();
</script>

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pangu/4.0.7/pangu.min.js"></script>
<script>
  (function () {
    function run() {
      if (window.pangu) {
        try {
          if (window.pangu.spacingElementByClassName) {
            window.pangu.spacingElementByClassName('main');
          } else {
            window.pangu.spacingPage();
          }
        } catch (e) {}
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { setTimeout(run, 80); });
    } else {
      setTimeout(run, 80);
    }
  })();
</script>

{{- /* 网站运行时间（首页网站信息卡片） */}}
<script>
  (function () {
    var el = document.getElementById("site-runtime");
    if (!el) return;
    var since = new Date(el.getAttribute("data-since") || "2025-01-01");
    if (isNaN(since.getTime())) return;
    var days = Math.max(0, Math.floor((Date.now() - since.getTime()) / 86400000));
    el.textContent = days + " 天";
  })();
</script>

{{- /* Live2D 看板娘（参考 luotian 右下角 2D 纸片人） */}}
<script>
  (function () {
    if (window.innerWidth <= 900) return;
    var base = "https://cdn.jsdelivr.net/gh/stevenjoezhang/live2d-widget@latest/";
    function load(src, type) {
      return new Promise(function (resolve) {
        var el;
        if (type === "css") {
          el = document.createElement("link");
          el.rel = "stylesheet";
          el.href = src;
        } else {
          el = document.createElement("script");
          el.src = src;
          el.defer = true;
        }
        el.onload = el.onerror = resolve;
        document.head.appendChild(el);
      });
    }
    Promise.all([
      load(base + "waifu.css", "css"),
      load(base + "live2d.min.js", "js"),
      load(base + "waifu-tips.js", "js")
    ]).then(function () {
      if (typeof window.initWidget !== "function") return;
      window.initWidget({
        waifuPath: base + "waifu-tips.json",
        cdnPath: "https://cdn.jsdelivr.net/gh/fghrsh/live2d_api/",
        tools: ["hitokoto", "switch-model", "switch-texture", "photo", "info", "quit"]
      });
    });
  })();
</script>

{{- /* 关闭浏览器原生 hover 提示（title 属性） */}}
<script>
  (function () {
    function stripTitles() {
      document.querySelectorAll("[title]").forEach(function (el) {
        el.removeAttribute("title");
      });
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", stripTitles);
    } else {
      stripTitles();
    }
    window.addEventListener("load", stripTitles);
  })();
</script>

<div class="side-tools" aria-label="页面工具">
  <button id="side-settings" class="side-tool" type="button" aria-label="页面设置" aria-expanded="false">

  </button>
  <div id="side-panel" class="side-panel">
    <button id="side-theme" class="side-panel-item" type="button" aria-label="切换日间/夜间模式">
      <span class="side-panel-icon">
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      </span>
      <span class="side-panel-label">明暗</span>
    </button>
    <button id="side-layout" class="side-panel-item" type="button" aria-label="切换单列/双列">
      <span class="side-panel-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18" rx="1"></rect><rect x="14" y="3" width="7" height="18" rx="1"></rect></svg>
      </span>
      <span class="side-panel-label">单/双列</span>
    </button>
  </div>
  <a href="#top" class="side-tool" aria-label="回到顶部">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
  </a>
</div>
<script>
  (function () {
    var root = document.documentElement;
    var tray = document.querySelector(".side-tools");
    var gear = document.getElementById("side-settings");
    if (gear && tray) {
      gear.addEventListener("click", function (e) {
        e.stopPropagation();
        var open = tray.classList.toggle("open");
        gear.setAttribute("aria-expanded", open ? "true" : "false");
      });
      document.addEventListener("click", function (e) {
        if (!tray.contains(e.target)) {
          tray.classList.remove("open");
          gear.setAttribute("aria-expanded", "false");
        }
      });
    }
    var themeBtn = document.getElementById("side-theme");
    if (themeBtn) {
      themeBtn.addEventListener("click", function () {
        var next = root.dataset.theme === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        localStorage.setItem("pref-theme", next);
      });
    }
    var layoutBtn = document.getElementById("side-layout");
    if (localStorage.getItem("home-layout") === "two") {
      document.body.classList.add("two-col");
    }
    if (layoutBtn) {
      layoutBtn.addEventListener("click", function () {
        var isTwo = document.body.classList.toggle("two-col");
        localStorage.setItem("home-layout", isTwo ? "two" : "one");
      });
    }
  })();
</script>

{{- /* 首页副标题打字机效果（Typed.js，和作者一致） */}}
<script>
  (function () {
    var el = document.getElementById("home-subtitle");
    if (!el) return;
    var text = el.getAttribute("data-text") || el.textContent || "";
    if (!text) return;
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      el.textContent = text;
      return;
    }
    function start() {
      if (typeof Typed !== "function") {
        el.textContent = text;
        return;
      }
      new Typed("#home-subtitle", {
        strings: [text],
        startDelay: 500,
        typeSpeed: 220,
        backSpeed: 100,
        backDelay: 2400,
        loop: true
      });
    }
    if (typeof Typed === "function") {
      start();
      return;
    }
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/typed.js@3.0.0/dist/typed.umd.min.js";
    s.onload = start;
    s.onerror = function () { el.textContent = text; };
    document.head.appendChild(s);
  })();
</script>
